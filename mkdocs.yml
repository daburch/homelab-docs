site_name: Homelab Documentation
site_description: Reusable patterns and guides for building a self-hosted homelab.
repo_url: https://github.com/daburch/homelab-docs
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - navigation.expand
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo

nav:
  - Start here: index.md
  - Platform:
      - Proxmox: proxmox.md
      - OPNsense: opnsense.md
      - Pi-hole and Unbound: pihole.md
      - Caddy: caddy.md
      - TrueNAS: truenas.md
      - Kubernetes: kubernetes.md
      - Terraform: terraform.md
  - Applications:
      - Vaultwarden: vaultwarden.md
      - Servarr: servarr.md
      - Homepage: homepage.md
  - Operations:
      - NUT: nut.md
      - Tekton: tekton.md
      - Documentation site: docs.md
  - Publication policy: publication-policy.md
